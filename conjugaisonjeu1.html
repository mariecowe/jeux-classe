<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Forge de Luw - Conjugaison Grecque</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #d35400;
            --gold: #f39c12;
            --bg: #f4f6f7;
            --success: #27ae60;
            --danger: #c0392b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 25px;
            border: 2px solid var(--primary);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            margin: 0 0 5px 0;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .input-group {
            margin: 20px 0;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary);
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1em;
            box-sizing: border-box;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            background: #edf2f7;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .target-card {
            background: linear-gradient(135deg, var(--primary), #34495e);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 25px;
        }

        .target-meaning {
            font-size: 1.4em;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 8px;
        }

        .target-details {
            font-size: 0.95em;
            opacity: 0.9;
        }

        .assembly-zone {
            background: #eef2f5;
            border: 2px dashed #b2bec3;
            border-radius: 8px;
            padding: 15px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .slot {
            min-width: 80px;
            height: 45px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: bold;
            color: var(--primary);
        }

        .blocks-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .block-column {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
        }

        .block-column h3 {
            font-size: 0.85em;
            text-transform: uppercase;
            text-align: center;
            color: #7f8c8d;
            margin: 0 0 10px 0;
        }

        .btn-block {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: white;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-block:hover {
            border-color: var(--accent);
            background: #fef5e7;
        }

        .btn-block.selected {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-submit {
            background: var(--success);
            color: white;
        }

        .btn-reset {
            background: #95a5a6;
            color: white;
        }

        .feedback {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .feedback.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .feedback.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .status-msg {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>La Forge de λύω</h1>
        <div class="subtitle">Assemble les éléments pour former la conjugaison exacte</div>
    </header>

    <!-- ÉCRAN D'ACCUEIL -->
    <div id="start-screen" class="screen active">
        <div class="input-group">
            <label for="player-name">Prénom et Nom de l'élève :</label>
            <input type="text" id="player-name" placeholder="Ex: Marie Cowé" required>
        </div>
        <button class="btn-action btn-submit" style="width: 100%;" onclick="validateAndStart()">Commencer le jeu</button>
    </div>

    <!-- ÉCRAN DE JEU -->
    <div id="game-screen" class="screen">
        <div class="score-board">
            <span>Score : <span id="score">0</span></span>
            <span>Erreurs : <span id="errors">0</span></span>
            <span>Question : <span id="q-num">1</span> / 6</span>
        </div>

        <div class="target-card">
            <div class="target-meaning" id="target-translation">--</div>
            <div class="target-details" id="target-grammar">--</div>
        </div>

        <div class="assembly-zone">
            <div class="slot" id="slot-prefix"></div>
            <div class="slot" id="slot-root"></div>
            <div class="slot" id="slot-suffix"></div>
        </div>

        <div class="blocks-container">
            <div class="block-column">
                <h3>Préfixe / Augment</h3>
                <div id="prefix-buttons"></div>
            </div>
            <div class="block-column">
                <h3>Radical</h3>
                <div id="root-buttons"></div>
            </div>
            <div class="block-column">
                <h3>Suffixe / Désinence</h3>
                <div id="suffix-buttons"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-action btn-reset" onclick="resetSelection()">Effacer</button>
            <button class="btn-action btn-submit" onclick="checkAnswer()">Valider</button>
        </div>

        <div id="feedback" class="feedback"></div>
    </div>

    <!-- ÉCRAN DE FIN -->
    <div id="end-screen" class="screen" style="text-align: center;">
        <h2>Forge terminée !</h2>
        <p class="subtitle" id="final-stats" style="font-size: 1.2em; margin: 15px 0;">Score final : 0 points</p>
        <div id="status-msg" class="status-msg">Envoi des résultats en cours...</div>
        <br>
        <button class="btn-action btn-submit" style="width: 100%;" onclick="location.reload()">Recommencer</button>
    </div>
</div>

<script>
    // CONFIGURATION GOOGLE FORMS
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfFgrbl_q1CCp4Sy9omtBrp_ykz8gR2ntiRFRoOPIMxa22qNA/formResponse";
    const ENTRY_NAME = "entry.452689880";   // ID Nom
    const ENTRY_SCORE = "entry.1000334399"; // ID Score
    const ENTRY_ERRORS = "entry.936994060"; // ID Erreurs

    // Base de données des exercices
    const dataset = [
        {
            translation: "Ils délient",
            grammar: "Indicatif Présent Actif, 3e p. pluriel",
            prefix: "",
            root: "λυ",
            suffix: "ουσι(ν)",
            options: {
                prefixes: ["—", "ε-", "λε-"],
                roots: ["λυ"],
                suffixes: ["ομεν", "ουσι(ν)", "ουσι"]
            }
        },
        {
            translation: "Il déliait / détruisait",
            grammar: "Indicatif Imparfait Actif, 3e p. singulier",
            prefix: "ε-",
            root: "λυ",
            suffix: "-ε(ν)",
            options: {
                prefixes: ["—", "ε-", "λε-"],
                roots: ["λυ"],
                suffixes: ["-ες", "-ε(ν)", "-ον"]
            }
        },
        {
            translation: "Vous délierez",
            grammar: "Indicatif Futur Actif, 2e p. pluriel",
            prefix: "",
            root: "λυ",
            suffix: "σετε",
            options: {
                prefixes: ["—", "ε-", "λε-"],
                roots: ["λυ"],
                suffixes: ["ετε", "σετε", "σατε"]
            }
        },
        {
            translation: "Nous délâmes / avons délié",
            grammar: "Indicatif Aoriste Actif, 1re p. pluriel",
            prefix: "ε-",
            root: "λυ",
            suffix: "-σαμεν",
            options: {
                prefixes: ["—", "ε-", "λε-"],
                roots: ["λυ"],
                suffixes: ["-ομεν", "-σαμεν", "-σομεν"]
            }
        },
        {
            translation: "J'ai délié (et c'est accompli)",
            grammar: "Indicatif Parfait Actif, 1re p. singulier",
            prefix: "λε-",
            root: "λυ",
            suffix: "κα",
            options: {
                prefixes: ["—", "ε-", "λε-"],
                roots: ["λυ"],
                suffixes: ["κα", "σα", "κας"]
            }
        },
        {
            translation: "Délier / Détruire",
            grammar: "Infinitif Présent Actif",
            prefix: "",
            root: "λυ",
            suffix: "ειν",
            options: {
                prefixes: ["—", "ε-"],
                roots: ["λυ"],
                suffixes: ["ειν", "σαι", "κεναι"]
            }
        }
    ];

    let currentIndex = 0;
    let score = 0;
    let errors = 0;
    let playerName = "";
    let selectedPrefix = "";
    let selectedRoot = "";
    let selectedSuffix = "";

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function validateAndStart() {
        const input = document.getElementById('player-name');
        if (!input.value.trim()) {
            alert("Veuillez saisir votre nom.");
            return;
        }
        playerName = input.value.trim();
        showScreen('game-screen');
        loadQuestion();
    }

    function loadQuestion() {
        const q = dataset[currentIndex];
        document.getElementById('target-translation').innerText = q.translation;
        document.getElementById('target-grammar').innerText = q.grammar;
        document.getElementById('q-num').innerText = currentIndex + 1;
        document.getElementById('feedback').className = 'feedback';

        resetSelection();
        renderButtons('prefix-buttons', q.options.prefixes, 'prefix');
        renderButtons('root-buttons', q.options.roots, 'root');
        renderButtons('suffix-buttons', q.options.suffixes, 'suffix');
    }

    function renderButtons(containerId, list, type) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        list.forEach(val => {
            const btn = document.createElement('button');
            btn.className = 'btn-block';
            btn.innerText = val;
            btn.onclick = () => selectBlock(type, val, btn);
            container.appendChild(btn);
        });
    }

    function selectBlock(type, value, btnElement) {
        const parent = btnElement.parentElement;
        Array.from(parent.children).forEach(b => b.classList.remove('selected'));
        
        btnElement.classList.add('selected');

        if (type === 'prefix') {
            selectedPrefix = value === "—" ? "" : value;
            document.getElementById('slot-prefix').innerText = selectedPrefix;
        } else if (type === 'root') {
            selectedRoot = value;
            document.getElementById('slot-root').innerText = selectedRoot;
        } else if (type === 'suffix') {
            selectedSuffix = value;
            document.getElementById('slot-suffix').innerText = selectedSuffix;
        }
    }

    function resetSelection() {
        selectedPrefix = "";
        selectedRoot = "";
        selectedSuffix = "";
        document.getElementById('slot-prefix').innerText = "";
        document.getElementById('slot-root').innerText = "";
        document.getElementById('slot-suffix').innerText = "";
        document.querySelectorAll('.btn-block').forEach(b => b.classList.remove('selected'));
    }

    function checkAnswer() {
        const q = dataset[currentIndex];
        const feedback = document.getElementById('feedback');

        if (selectedPrefix === q.prefix && selectedRoot === q.root && selectedSuffix === q.suffix) {
            score += 10;
            document.getElementById('score').innerText = score;
            feedback.innerText = "Bravo ! C'est la forme correcte : " + (q.prefix + q.root + q.suffix);
            feedback.className = "feedback success";
            
            setTimeout(() => {
                currentIndex++;
                if (currentIndex < dataset.length) {
                    loadQuestion();
                } else {
                    endGame();
                }
            }, 1200);
        } else {
            errors++;
            document.getElementById('errors').innerText = errors;
            feedback.innerText = "Erreur ! Vérifie tes blocs (augmentation, radical ou terminaison).";
            feedback.className = "feedback error";
        }
    }

    function endGame() {
        showScreen('end-screen');
        document.getElementById('final-stats').innerText = `Score total : ${score} points (${errors} erreur${errors > 1 ? 's' : ''})`;
        sendResultsToGoogleForms();
    }

    function sendResultsToGoogleForms() {
        const statusEl = document.getElementById('status-msg');
        statusEl.innerText = "Transmission des résultats...";

        const formData = new FormData();
        formData.append(ENTRY_NAME, playerName);
        formData.append(ENTRY_SCORE, score);
        formData.append(ENTRY_ERRORS, errors);

        fetch(FORM_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
        })
        .then(() => {
            statusEl.innerText = "✅ Résultats enregistrés avec succès !";
            statusEl.style.color = "var(--success)";
        })
        .catch(() => {
            statusEl.innerText = "⚠️ Erreur lors de l'envoi des résultats.";
            statusEl.style.color = "var(--danger)";
        });
    }
</script>
</body>
</html>
