<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>NOSTOS : Le Chrono-Sprint d'Ulysse</title>
    <style>
        body {
            background-color: #0b1d3a;
            color: #f4efe6;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        #game-box {
            width: 100%;
            max-width: 700px;
            background: #142848;
            border: 3px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
        }
        h1 {
            color: #d4af37;
            text-align: center;
            font-size: 1.5rem;
            margin-top: 0;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 5px;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .stage-title {
            color: #d4af37;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        .desc-box {
            background: rgba(0,0,0,0.25);
            padding: 10px;
            border-left: 4px solid #d4af37;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .challenge-box {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid #d4af37;
            padding: 10px;
            border-radius: 5px;
            font-style: italic;
            margin-bottom: 15px;
        }
        .quiz-container {
            background: #f4efe6;
            color: #111;
            padding: 15px;
            border-radius: 6px;
        }
        .quiz-container h3 {
            margin-top: 0;
            color: #0b1d3a;
            font-size: 1rem;
        }
        .opt-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: #1a3b5c;
            color: #fff;
            border: 1px solid #d4af37;
            padding: 10px;
            margin-top: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .opt-btn:hover {
            background: #d4af37;
            color: #0b1d3a;
            font-weight: bold;
        }
        #feedback {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
            line-height: 1.4;
        }
        .success { background: #2e7d32; color: #fff; }
        .error { background: #b23b3b; color: #fff; }
        #next-btn {
            display: none;
            margin-top: 15px;
            width: 100%;
            background: #d4af37;
            color: #0b1d3a;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div id="game-box">
    <h1>🏛️ NOSTOS : Le Chrono-Sprint d'Ulysse</h1>
    
    <div class="hud">
        <div>⏱️ Temps : <span id="timer">00:00</span></div>
        <div>🔄 Tentative : <span id="attempts">1</span></div>
        <div>📌 Étape : <span id="step">1/7</span></div>
    </div>

    <div class="stage-title" id="stage-title">Chargement...</div>
    <div class="desc-box" id="stage-desc">...</div>
    <div class="challenge-box" id="stage-challenge">...</div>

    <div class="quiz-container" id="quiz-area">
        <h3 id="quiz-question">...</h3>
        <div id="options-area"></div>
    </div>

    <div id="feedback"></div>
    <button id="next-btn">Étape Suivante ➔</button>
</div>

<script>
var data = [
    {
        title: "1. Le Pays des Lotophages",
        desc: "Vos marins ont goûté au lotos, la fleur magique de l'oubli, et refusent de remonter sur le navire.",
        challenge: "Un marin murmure : 'Mon âme rejette la LÉTHÉ et ne désire que le NOSTOS, mais le philtre provoque une A-MNÉSIE totale.'",
        question: "Pour leur redonner la mémoire, quel sens attribuez-vous à ces trois racines grecques ?",
        answers: [
            { text: "Léthé = L'oubli / Nostos = Le retour / A-mnésie = La perte de mémoire", correct: true },
            { text: "Léthé = Le sommeil / Nostos = La gloire / A-mnésie = La paralysie", correct: false },
            { text: "Léthé = La folie / Nostos = La patrie / A-mnésie = L'illusion", correct: false }
        ],
        explain: "Lêthê est l'oubli, Nostos le retour (origine de 'nostalgie'), et Mnêmê la mémoire ('a-' privatif = absence de mémoire)."
    },
    {
        title: "2. L'Antre du Cyclope Polyphème",
        desc: "Polyphème a bloqué la sortie de sa caverne. Vous préparez votre piège après l'avoir enivré.",
        challenge: "Le géant grogne : 'Dis-moi ton nom avant que je ne te dévore !'",
        question: "Quelle ruse de langage ('mêtis') devez-vous employer ?",
        answers: [
            { text: "Dire que vous vous appelez 'Polytropos' (l'homme aux mille tours)", correct: false },
            { text: "Répondre que votre nom est 'Outis' ('Personne' en grec)", correct: true },
            { text: "Refuser de répondre pour attiser sa peur", correct: false }
        ],
        explain: "En disant 'Outis' (Personne), quand le Cyclope criera 'Personne me tue !', les autres cyclopes ne viendront pas à son secours."
    },
    {
        title: "3. L'Île d'Éole",
        desc: "Éole vous donne une outre renfermant tous les vents contraires. Vos marins curieux veulent l'ouvrir.",
        challenge: "L'inscription sur l'outre indique : 'CAVE ! NULLUS HOMO HANC URTICAM APERIAT, NAM VENTI TEMPESTATEM SAEVAM FERENT.'",
        question: "Quelle est la traduction exacte de cet avertissement ?",
        answers: [
            { text: "Attention ! Que nul homme n'ouvre cette outre, car les vents apporteraient une terrible tempête.", correct: true },
            { text: "Prenez garde ! Seul l'homme pur peut ouvrir cette outre pour libérer les brises.", correct: false },
            { text: "Danger ! L'or contenu dans cette outre déclenchera la colère des dieux.", correct: false }
        ],
        explain: "'Cave' = Attention, 'nullus homo' = aucun homme, 'tempestatem ferent' = apporteront la tempête."
    },
    {
        title: "4. Circé l'Enchanteresse",
        desc: "Circé a changé vos marins en porcs. Hermès vous remet la plante magique 'Moly' pour vous protéger.",
        challenge: "Pour résister à la magie, vous devez identifier le fondement du pouvoir de la déesse.",
        question: "Quel terme issu des racines grecques 'meta' (changement) et 'morphê' (forme) qualifie ce sortilège ?",
        answers: [
            { text: "L'Anthropomorphisme", correct: false },
            { text: "La Morphologie", correct: false },
            { text: "La Métamorphose", correct: true }
        ],
        explain: "La métamorphose désigne la transformation physique d'un être."
    },
    {
        title: "5. La Nékyia (Les Enfers)",
        desc: "Vous versez du sang dans la fosse pour invoquer les ombres du royaume des morts.",
        challenge: "L'ombre d'Achille apparaît. Le récit la qualifie de : 'Achille aux pieds légers'.",
        question: "Quel procédé poétique homérique est utilisé ici ?",
        answers: [
            { text: "Une épithète homérique", correct: true },
            { text: "Une métaphore filée", correct: false },
            { text: "Une allégorie poétique", correct: false }
        ],
        explain: "L'épithète homérique est une formule caractérisant un héros ou une divinité (ex: 'l'Aurore aux doigts de rose')."
    },
    {
        title: "6. Le Chant des Sirènes",
        desc: "Les Sirènes chantent sur leurs récifs, attirant les marins vers une mort certaine.",
        challenge: "Vous voulez écouter leur chant sans faire faire naufrage au navire.",
        question: "Quelle combinaison de mesures devez-vous ordonner ?",
        answers: [
            { text: "Boucher les oreilles des marins avec de la cire et vous faire attacher au mât.", correct: true },
            { text: "Couvrir leur musique en faisant jouer de la lyre par un marin.", correct: false },
            { text: "Attacher tout l'équipage au mât et ramer les yeux bandés.", correct: false }
        ],
        explain: "La cire protège l'équipage et le lien au mât empêche Ulysse de se jeter à l'eau."
    },
    {
        title: "7. Le Retour à Ithaque",
        desc: "Après l'épreuve de l'arc, vous devez prouver votre identité à Pénélope.",
        challenge: "Pénélope ordonne de déplacer le lit nuptial de votre chambre.",
        question: "Quel secret sur sa fabrication prouve que vous êtes le vrai Ulysse ?",
        answers: [
            { text: "Il est forgé dans de l'or massif rapporté de Troie.", correct: false },
            { text: "Son pied est sculpté dans le tronc d'un olivier vivant encore enraciné.", correct: true },
            { text: "Il est fabriqué avec le bois du Cheval de Troie.", correct: false }
        ],
        explain: "Ulysse a sculpté le lit directement dans le tronc d'un olivier vivant autour duquel la chambre a été construite."
    }
];

var currentIdx = 0;
var currentAttempts = 1;
var timerInterval = null;
var totalSeconds = 0;

function startTimer() {
    if(!timerInterval) {
        timerInterval = setInterval(function() {
            totalSeconds++;
            var m = Math.floor(totalSeconds / 60);
            var s = totalSeconds % 60;
            document.getElementById('timer').textContent = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
        }, 1000);
    }
}

function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    totalSeconds = 0;
    document.getElementById('timer').textContent = "00:00";
}

function showStage() {
    var curr = data[currentIdx];
    document.getElementById('step').textContent = (currentIdx + 1) + "/7";
    document.getElementById('stage-title').textContent = curr.title;
    document.getElementById('stage-desc').textContent = curr.desc;
    document.getElementById('stage-challenge').textContent = curr.challenge;
    document.getElementById('quiz-question').textContent = curr.question;
    document.getElementById('feedback').style.display = 'none';
    
    var nextBtn = document.getElementById('next-btn');
    nextBtn.style.display = 'none';

    var optArea = document.getElementById('options-area');
    optArea.innerHTML = '';
    
    for (var i = 0; i < curr.answers.length; i++) {
        (function(ans) {
            var btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.textContent = ans.text;
            btn.onclick = function() { checkAnswer(ans.correct, curr.explain); };
            optArea.appendChild(btn);
        })(curr.answers[i]);
    }
}

function checkAnswer(isCorrect, explainText) {
    startTimer();
    var fb = document.getElementById('feedback');
    var btns = document.querySelectorAll('.opt-btn');
    for (var i = 0; i < btns.length; i++) { btns[i].disabled = true; }

    var nextBtn = document.getElementById('next-btn');

    if(isCorrect) {
        fb.className = 'success';
        fb.innerHTML = '<strong>✅ EXACT !</strong> ' + explainText;
        fb.style.display = 'block';
        
        if(currentIdx < data.length - 1) {
            nextBtn.textContent = 'Étape Suivante ➔';
            nextBtn.onclick = function() { currentIdx++; showStage(); };
        } else {
            clearInterval(timerInterval);
            nextBtn.textContent = '🏁 Victoire ! Voir le Chrono';
            nextBtn.onclick = finishGame;
        }
        nextBtn.style.display = 'block';
    } else {
        clearInterval(timerInterval);
        fb.className = 'error';
        fb.innerHTML = '<strong>❌ ERREUR FATALE !</strong> ' + explainText + '<br><br><strong>Naufrage ! Renvoyé au début du jeu.</strong>';
        fb.style.display = 'block';

        nextBtn.textContent = '🔄 Recommencer depuis l\'Étape 1';
        nextBtn.onclick = function() {
            currentAttempts++;
            document.getElementById('attempts').textContent = currentAttempts;
            currentIdx = 0;
            resetTimer();
            showStage();
        };
        nextBtn.style.display = 'block';
    }
}

function finishGame() {
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    document.getElementById('stage-title').textContent = "🏛️ TRIOMPHE D'ITHAQUE !";
    document.getElementById('stage-desc').textContent = "Bravo Ulysse ! Vous avez réussi le parcours sans aucune faute !";
    document.getElementById('stage-challenge').textContent = "Score Final : " + m + " min " + s + " sec (en " + currentAttempts + " tentative(s)).";
    document.getElementById('quiz-area').style.display = 'none';
    document.getElementById('feedback').style.display = 'none';
    
    var nextBtn = document.getElementById('next-btn');
    nextBtn.textContent = "🚀 Rejouer pour battre mon temps";
    nextBtn.onclick = function() {
        currentAttempts = 1;
        document.getElementById('attempts').textContent = currentAttempts;
        currentIdx = 0;
        resetTimer();
        document.getElementById('quiz-area').style.display = 'block';
        showStage();
    };
}

showStage();
</script>

</body>
</html>
