<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duel de Rapidité - λύω</title>
    <style>
        :root {
            --primary: #8e44ad;
            --accent: #e67e22;
            --danger: #e74c3c;
            --success: #2ecc71;
            --bg: #f5f6fa;
            --card: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: #2c3e50;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .game-container {
            width: 100%;
            max-width: 650px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 25px;
            border: 3px solid var(--primary);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            margin: 0 0 5px 0;
            font-size: 1.8em;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .input-group {
            margin: 20px 0;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary);
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1em;
            box-sizing: border-box;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            background: #f0edfd;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .timer-box {
            color: var(--danger);
            font-size: 1.2em;
        }

        .timer-bar-container {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: var(--danger);
            transition: width 0.1s linear;
        }

        .arena {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
        }

        .greek-prompt {
            font-size: 3em;
            font-weight: bold;
            color: #f1c40f;
            letter-spacing: 1px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-option {
            padding: 15px 20px;
            background: #fff;
            border: 2px solid #dcdde1;
            border-radius: 10px;
            font-size: 1.05em;
            font-weight: 600;
            color: #2f3640;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .btn-option:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f8f5ff;
            transform: translateY(-2px);
        }

        .btn-option.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .btn-option.wrong {
            background: var(--danger) !important;
            color: white !important;
            border-color: var(--danger) !important;
        }

        .feedback {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            min-height: 24px;
        }

        .feedback.success { color: var(--success); }
        .feedback.error { color: var(--danger); }

        .status-msg {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>Duel de Rapidité</h1>
        <div class="subtitle">Trouve la traduction exacte avant la fin du chrono !</div>
    </header>

    <!-- ÉCRAN D'ACCUEIL -->
    <div id="start-screen" class="screen active">
        <div class="input-group">
            <label for="player-name">Prénom et Nom de l'élève :</label>
            <input type="text" id="player-name" placeholder="Ex: Marie Curie" required>
        </div>
        <button class="btn-option" style="width: 100%; text-align: center; background: var(--primary); color: white;" onclick="validateAndStart()">Entrer dans l'Arène</button>
    </div>

    <!-- ÉCRAN DE JEU -->
    <div id="game-screen" class="screen">
        <div class="status-bar">
            <span>Score : <span id="score">0</span> / 200</span>
            <span class="timer-box">⏱️ <span id="time-display">10</span>s</span>
            <span>Erreurs : <span id="errors">0</span></span>
            <span>Forme : <span id="q-num">1</span> / 20</span>
        </div>

        <div class="timer-bar-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>

        <div class="arena">
            <div class="greek-prompt" id="greek-prompt">--</div>
        </div>

        <div class="options-grid" id="options-container"></div>

        <div id="feedback" class="feedback"></div>
    </div>

    <!-- ÉCRAN DE FIN -->
    <div id="end-screen" class="screen" style="text-align: center;">
        <h2>Duel Terminé !</h2>
        <p class="subtitle">Fin du chrono et des épreuves.</p>
        <p id="final-stats" style="font-size: 1.2em; font-weight: bold; margin: 15px 0;">Score final : 0 / 200</p>
        <div id="status-msg" class="status-msg">Envoi des résultats en cours...</div>
        <br>
        <button class="btn-option" style="text-align:center; background: var(--primary); color:white; width: auto; display: inline-block;" onclick="location.reload()">Rejouer un duel</button>
    </div>
</div>

<script>
    // CONFIGURATION GOOGLE FORMS
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdYHIyDMvZDMbkEsLDqWCFGwltyBpnBK-9kn-Ao1b04SVfQgQ/formResponse";
    const ENTRY_NAME = "entry.268064258";   // ID Nom
    const ENTRY_SCORE = "entry.1504640674"; // ID Score
    const ENTRY_ERRORS = "entry.1244821250"; // ID Erreurs

    // 20 formes du verbe luw axées sur la reconnaissance du grec vers le français
    const dataset = [
        {
            greek: "λύεις",
            correct: "Tu délies (présent)",
            choices: ["Tu délies (présent)", "Tu délieras (futur)", "Que tu délies (subjonctif)"]
        },
        {
            greek: "λύσεις",
            correct: "Tu délieras (futur)",
            choices: ["Tu délias (aoriste)", "Tu délies (présent)", "Tu délieras (futur)"]
        },
        {
            greek: "ἔλυες",
            correct: "Tu déliais (imparfait)",
            choices: ["Tu délias (aoriste)", "Tu déliais (imparfait)", "Tu as délié (parfait)"]
        },
        {
            greek: "ἔλυσας",
            correct: "Tu délias / as délié (aoriste)",
            choices: ["Tu délias / as délié (aoriste)", "Tu déliais (imparfait)", "Délie ! (impératif)"]
        },
        {
            greek: "λύωμεν",
            correct: "Délions ! / Que nous délions (subjonctif)",
            choices: ["Nous délions (indicatif)", "Délions ! / Que nous délions (subjonctif)", "Nous délierons (futur)"]
        },
        {
            greek: "λύομεν",
            correct: "Nous délions (indicatif)",
            choices: ["Que nous délions (subjonctif)", "Nous déliions (imparfait)", "Nous délions (indicatif)"]
        },
        {
            greek: "λέλυκα",
            correct: "J'ai délié (et cela reste accompli - parfait)",
            choices: ["Je déliai (aoriste)", "J'ai délié (et cela reste accompli - parfait)", "J'avais délié (plus-que-parfait)"]
        },
        {
            greek: "ἐλελύκειν",
            correct: "J'avais délié (plus-que-parfait)",
            choices: ["J'avais délié (plus-que-parfait)", "J'ai délié (parfait)", "Je déliais (imparfait)"]
        },
        {
            greek: "λύεσθε",
            correct: "Vous êtes déliés (présent passif)",
            choices: ["Vous déliez (présent actif)", "Vous êtes déliés (présent passif)", "Vous délierez (futur actif)"]
        },
        {
            greek: "ἐλύεσθε",
            correct: "Vous étiez déliés (imparfait passif)",
            choices: ["Vous déliiez (imparfait actif)", "Vous fûtes déliés (aoriste passif)", "Vous étiez déliés (imparfait passif)"]
        },
        {
            greek: "ἐλύθητε",
            correct: "Vous fûtes déliés (aoriste passif)",
            choices: ["Vous fûtes déliés (aoriste passif)", "Vous étiez déliés (imparfait passif)", "Vous avez délié (parfait actif)"]
        },
        {
            greek: "λύειν",
            correct: "Délier (infinitif présent)",
            choices: ["Avoir délié (infinitif parfait)", "Délier (infinitif présent)", "Délier (infinitif aoriste)"]
        },
        {
            greek: "λῦσαι",
            correct: "Délier (infinitif aoriste)",
            choices: ["Délier (infinitif aoriste)", "Délier (infinitif présent)", "Il délierait (optatif)"]
        },
        {
            greek: "λῦσον",
            correct: "Délie ! (impératif aoriste 2sg)",
            choices: ["Nous délions (indicatif)", "Délie ! (impératif aoriste 2sg)", "Déliant (participe)"]
        },
        {
            greek: "λύων",
            correct: "Déliant (participe présent masculin)",
            choices: ["Déliant (participe présent masculin)", "Ayant délié (participe aoriste)", "Délier (infinitif)"]
        },
        {
            greek: "λύσας",
            correct: "Ayant délié (participe aoriste masculin)",
            choices: ["Tu délias (indicatif)", "Déliant (participe présent)", "Ayant délié (participe aoriste masculin)"]
        },
        {
            greek: "λύσοιμι",
            correct: "Si je déliais / Je délierais (optatif futur)",
            choices: ["Que je délie (subjonctif)", "Si je déliais / Je délierais (optatif futur)", "Je délierai (indicatif)"]
        },
        {
            greek: "λύσω",
            correct: "Que je délie (subjonctif) / Je délierai (futur)",
            choices: ["Que je délie (subjonctif) / Je délierai (futur)", "Je déliais (imparfait)", "J'ai délié (parfait)"]
        },
        {
            greek: "λέλυμαι",
            correct: "Je suis délié (parfait passif)",
            choices: ["Je suis délié (parfait passif)", "Je me délie (présent moyen)", "J'étais délié (plus-que-parfait)"]
        },
        {
            greek: "λυθήσομαι",
            correct: "Je serai délié (futur passif)",
            choices: ["Je serai délié (futur passif)", "Je me délierai (futur moyen)", "J'ai été délié (aoriste passif)"]
        }
    ];

    let currentIndex = 0;
    let score = 0;
    let errors = 0;
    let timeLeft = 10;
    let timerInterval = null;
    let isAnswered = false;
    let playerName = "";

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function validateAndStart() {
        const input = document.getElementById('player-name');
        if (!input.value.trim()) {
            alert("Veuillez saisir votre nom.");
            return;
        }
        playerName = input.value.trim();
        showScreen('game-screen');
        loadQuestion();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 10;
        updateTimerDisplay();

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                updateTimerDisplay();
                clearInterval(timerInterval);
                handleTimeout();
            } else {
                updateTimerDisplay();
            }
        }, 100);
    }

    function updateTimerDisplay() {
        document.getElementById('time-display').innerText = Math.ceil(timeLeft);
        const percentage = (timeLeft / 10) * 100;
        document.getElementById('timer-bar').style.width = percentage + '%';
    }

    function loadQuestion() {
        isAnswered = false;
        const q = dataset[currentIndex];
        document.getElementById('greek-prompt').innerText = q.greek;
        document.getElementById('q-num').innerText = currentIndex + 1;
        document.getElementById('feedback').innerText = '';
        document.getElementById('feedback').className = 'feedback';

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = choice;
            btn.onclick = () => checkAnswer(choice, btn);
            container.appendChild(btn);
        });

        startTimer();
    }

    function checkAnswer(selectedChoice, btnElement) {
        if (isAnswered) return;
        isAnswered = true;
        clearInterval(timerInterval);

        const q = dataset[currentIndex];
        const buttons = document.querySelectorAll('.btn-option');
        
        buttons.forEach(b => b.disabled = true);

        if (selectedChoice === q.correct) {
            score += 10;
            document.getElementById('score').innerText = score;
            btnElement.classList.add('correct');
            showFeedback("Rapidité et précision ! +10 pts", "success");
        } else {
            errors++;
            document.getElementById('errors').innerText = errors;
            btnElement.classList.add('wrong');
            buttons.forEach(b => {
                if (b.innerText === q.correct) b.classList.add('correct');
            });
            showFeedback("Oups ! La bonne réponse était surlignée.", "error");
        }

        nextStep();
    }

    function handleTimeout() {
        if (isAnswered) return;
        isAnswered = true;

        errors++;
        document.getElementById('errors').innerText = errors;

        const q = dataset[currentIndex];
        const buttons = document.querySelectorAll('.btn-option');
        
        buttons.forEach(b => {
            b.disabled = true;
            if (b.innerText === q.correct) b.classList.add('correct');
        });

        showFeedback("Temps écoulé !", "error");
        nextStep();
    }

    function showFeedback(text, type) {
        const fb = document.getElementById('feedback');
        fb.innerText = text;
        fb.className = 'feedback ' + type;
    }

    function nextStep() {
        setTimeout(() => {
            currentIndex++;
            if (currentIndex < dataset.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }, 1500);
    }

    function endGame() {
        showScreen('end-screen');
        document.getElementById('final-stats').innerText = `Score final : ${score} / 200 (${errors} erreur${errors > 1 ? 's' : ''})`;
        sendResultsToGoogleForms();
    }

    function sendResultsToGoogleForms() {
        const statusEl = document.getElementById('status-msg');
        statusEl.innerText = "Transmission des résultats en cours...";

        const formData = new FormData();
        formData.append(ENTRY_NAME, playerName);
        formData.append(ENTRY_SCORE, score);
        formData.append(ENTRY_ERRORS, errors);

        fetch(FORM_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
        })
        .then(() => {
            statusEl.innerText = "✅ Résultats enregistrés avec succès !";
            statusEl.style.color = "var(--success)";
        })
        .catch(() => {
            statusEl.innerText = "⚠️ Erreur lors de l'envoi des résultats.";
            statusEl.style.color = "var(--danger)";
        });
    }
</script>
</body>
</html>
